map $http_upgrade $atelier_web_connection_upgrade {
    default upgrade;
    '' close;
}

log_format atelier_web_no_query '$remote_addr $host "$request_method $uri $server_protocol" $status';

server {
    listen 80;
    listen [::]:80;
    server_name at.artsmart.space www.at.artsmart.space;
    access_log /var/log/nginx/atelier_web.access.log atelier_web_no_query;
    return 301 https://at.artsmart.space$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.at.artsmart.space;
    access_log /var/log/nginx/atelier_web.access.log atelier_web_no_query;
    ssl_certificate /etc/nginx/ssl/at.artsmart.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/at.artsmart.space/privkey.pem;
    return 301 https://at.artsmart.space$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name at.artsmart.space;
    access_log /var/log/nginx/atelier_web.access.log atelier_web_no_query;
    ssl_certificate /etc/nginx/ssl/at.artsmart.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/at.artsmart.space/privkey.pem;
    client_max_body_size 110m;
    add_header Referrer-Policy "no-referrer" always;

    auth_basic "Atelier private preview";
    auth_basic_user_file /etc/nginx/.atelier_web.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $atelier_web_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
